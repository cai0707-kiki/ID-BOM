    <script>
    (function(){
        var dpr = window.devicePixelRatio || 1;
        var target = 1.5;
        if (dpr < target) {
            var scale = target / dpr;
            var style = document.createElement('style');
            // Chrome/Edge/Safari 使用 zoom 属性（同步缩放，事件坐标自动适配）
            var css = 'html { zoom: ' + scale + '; ';
            // Firefox 后备：使用 transform（可能有轻微点击偏移，但视觉一致）
            css += '-moz-transform: scale(' + scale + '); -moz-transform-origin: 0 0; ';
            css += '}';
            style.textContent = css;
            document.head.appendChild(style);
        }
    })();
</script>

    };

    /* ==================== 全局状态 ==================== */

    var allRows = [];
    var currentMatch = null;
    var selectedAccessories = [];
    var currentAccessoryKey = '';
    var currentAccessoryItems = [];
    var tempSelectedItems = [];
    var standardCache = {};
    var cableFilterState = { length: 'all', material: 'all' };

    /* ==================== 工具函数 ==================== */

    function isAccessory(r) {
        return r && r[0] && r[0].trim() === '配件';
    }

    function getAccCol(r, cfg) {
        return isAccessory(r) ? cfg.accCol : cfg.col;
    }

    function getAccFlagCol(r, cfg) {
        return isAccessory(r) ? cfg.accFlagCol : cfg.flagCol;
    }

    /* ==================== 数据加载 ==================== */

    function loadData() {
        var el = document.getElementById('embeddedData');
        if (!el) return;
        try {
            var raw = JSON.parse(el.textContent);
            if (raw.length > 0 && raw[0]._version) raw = raw.slice(1);
            var embedded = Array.isArray(raw) && raw.length > 0
                ? raw.map(function(i) {
                    var r = i.value || i;
                    return r.map(function(c) {
                        return typeof c === 'string' ? c.replace(/\\r$/g, '').replace(/\r/g, '') : c;
                    });
                })
                : [];
            if (embedded.length > 0) {
                allRows = embedded;
                init();
            }
        } catch (e) {
            console.error('Parse error:', e);
        }
    }

    /* ==================== 级联选择器初始化 ==================== */

    function init() {
        var seen = {};
        var catList = [];
        allRows.forEach(function(r) {
            if (r.length > 1 && r[1] && r[0] && r[0].trim() === '相机') {
                var c = r[1].trim();
                if (!seen[c]) { seen[c] = true; catList.push(c); }
            }
        });
        var sel = document.getElementById('categorySelect');
        catList.forEach(function(c) {
            var o = document.createElement('option');
            o.value = c;
            o.textContent = c;
            sel.appendChild(o);
        });
    }

    function onCategoryChange() {
        var cat = document.getElementById('categorySelect').value;
        var ss = document.getElementById('seriesSelect');
        var ms = document.getElementById('modelSelect');
        ss.innerHTML = '<option value="">请选择产品系列</option>';
        ss.disabled = true;
        ms.innerHTML = '<option value="">请先选择产品大类</option>';
        ms.disabled = true;
        updateSelectStyle(ss); updateSelectStyle(ms); updateSelectStyle(document.getElementById('categorySelect'));
        clearAccessoryPanel(); clearTable();
        if (!cat) return;
        var seen = {};
        var seriesList = [];
        allRows.forEach(function(r) {
            if (r.length > 2 && r[1] && r[1].trim() === cat && r[2] && r[0] && r[0].trim() === '相机') {
                var s = r[2].trim();
                if (!seen[s]) { seen[s] = true; seriesList.push(s); }
            }
        });
        seriesList.forEach(function(v) {
            var o = document.createElement('option');
            o.value = v;
            o.textContent = v;
            ss.appendChild(o);
        });
        ss.disabled = false;
    }

    function onSeriesChange() {
        var cat = document.getElementById('categorySelect').value;
        var series = document.getElementById('seriesSelect').value;
        var ms = document.getElementById('modelSelect');
        ms.innerHTML = '<option value="">请选择具体型号</option>';
        ms.disabled = true;
        updateSelectStyle(ms); updateSelectStyle(document.getElementById('seriesSelect'));
        clearAccessoryPanel(); clearTable();
        if (!series) return;
        var seen = {};
        var modelList = [];
        allRows.forEach(function(r) {
            if (r.length > 4 && r[1] && r[1].trim() === cat && r[2] && r[2].trim() === series
                && r[3] && r[4] && r[0] && r[0].trim() === '相机') {
                var m = r[3].trim();
                if (!seen[m]) { seen[m] = true; modelList.push(m); }
            }
        });
        modelList.forEach(function(mdl) {
            var o = document.createElement('option');
            o.value = mdl;
            o.textContent = mdl;
            ms.appendChild(o);
        });
        ms.disabled = false;
    }

    function onModelChange() {
        var cat = document.getElementById('categorySelect').value;
        var series = document.getElementById('seriesSelect').value;
        var mdl = document.getElementById('modelSelect').value;
        updateSelectStyle(document.getElementById('modelSelect'));
        clearAccessoryPanel(); clearTable();
        if (!mdl) return;
        for (var i = 0; i < allRows.length; i++) {
            var r = allRows[i];
            if (r.length > 4 && r[1] && r[1].trim() === cat && r[2] && r[2].trim() === series
                && r[3] && r[3].trim() === mdl) {
                currentMatch = r;
                break;
            }
        }
        if (currentMatch) { renderAccessoryCategories(); generateStandardAccessories(); }
    }

    function updateSelectStyle(s) {
        if (s.value) s.classList.add('has-value');
        else s.classList.remove('has-value');
    }

    /* ==================== 渲染配件分类按钮 ==================== */

    function renderAccessoryCategories() {
        var c = document.getElementById('accessoryCategories');
        var h = '';
        var keys = Object.keys(accessoryColumns);

        for (var i = 0; i < keys.length; i++) {
            var cfg = accessoryColumns[keys[i]];
            var val = currentMatch[cfg.col] || '';
            if (!val) continue;

            // 解析标签和标志
            var refTags = val.split(';').map(function(s) {
                return s.trim().toLowerCase();
            }).filter(function(s) { return s.length > 0; });

            var refFlags = (currentMatch[cfg.flagCol] || '').split(';').map(function(s) {
                return s.trim();
            });

            // 统计匹配到的配件总数和其中标配数
            var matchCount = 0;
            var stdCount = 0;
            allRows.forEach(function(r) {
                var accCol = getAccCol(r, cfg);
                if (r.length > accCol && r[1] && r[1].trim() === cfg.name) {
                    var accFlagCol = getAccFlagCol(r, cfg);
                    var accTag = (r[accCol] || '').toLowerCase();
                    var accFlag = accFlagCol >= 0 ? (r[accFlagCol] || '') : '';
                    var accParts = accTag.split(';').map(function(s) { return s.trim(); });
                    for (var k = 0; k < refTags.length; k++) {
                        for (var p = 0; p < accParts.length; p++) {
                            if (accParts[p] === refTags[k]) {
                                matchCount++;
                                if (accFlag === '1') stdCount++;
                                return;
                            }
                        }
                    }
                }
            });

            if (matchCount === 0) continue;
            if (matchCount === stdCount) continue;

            var cnt = selectedAccessories.filter(function(a) { return a.key === keys[i]; }).length;
            var txt = cnt > 0 ? cnt + ' 个已选' : '点击选择';
            h += '<div class="accessory-category" onclick="openAccessoryModal(\'' + keys[i] + '\')">'
               +   '<div class="accessory-category-left">'
               +     '<div class="accessory-icon">' + cfg.icon + '</div>'
               +     '<div>'
               +       '<div class="accessory-category-name">' + cfg.name + '</div>'
               +       '<div class="accessory-category-count">' + txt + '</div>'
               +     '</div>'
               +   '</div>'
               +   '<div class="accessory-arrow">›</div>'
               + '</div>';
        }
        c.innerHTML = h || '<div style="text-align:center;color:#94a3b8;font-size:11px;padding:12px;">暂无配件</div>';
    }

    /* ==================== 弹窗尺寸自适应 ==================== */

    function resizeModalBody() {
        var modal = document.querySelector('#accessoryModal .modal');
        var body = document.querySelector('#accessoryModal .modal-body');
        var header = document.querySelector('#accessoryModal .modal-header');
        var footer = document.querySelector('#accessoryModal .modal-footer');
        if (!modal || !body || !header || !footer) return;
        var vh = window.innerHeight || document.documentElement.clientHeight;
        var maxH = Math.floor(vh * 0.8);
        var headerH = header.offsetHeight || 60;
        var footerH = footer.offsetHeight || 50;
        var pad = 28;
        body.style.maxHeight = (maxH - headerH - footerH - pad) + 'px';
    }

    window.addEventListener('resize', resizeModalBody);

    /* ==================== 打开配件选择弹窗 ==================== */

    function openAccessoryModal(key) {
        currentAccessoryKey = key;
        var cfg = accessoryColumns[key];
        var catName = cfg.name;
        var refVal = currentMatch[cfg.col] || '';

        var refTags = refVal.split(';').map(function(s) {
            return s.trim().toLowerCase();
        }).filter(function(s) { return s.length > 0; });

        var refFlags = (currentMatch[cfg.flagCol] || '').split(';').map(function(s) {
            return s.trim();
        });

        var camStdTags = {};
        refTags.forEach(function(t, i) {
            if (refFlags[i] === '1') camStdTags[t] = true;
        });

        currentAccessoryItems = [];
        var _tmpItems = [];

        allRows.forEach(function(r) {
            var accCol = getAccCol(r, cfg);
            if (r.length > accCol && (r[accCol] || '').trim() !== '' && r[1] && r[1].trim() === cfg.name) {
                var accFlagCol = getAccFlagCol(r, cfg);
                var accFlag = accFlagCol >= 0 ? (r[accFlagCol] || '') : '';
                var accTag = (r[accCol] || '').toLowerCase();
                var accParts = accTag.split(';').map(function(s) { return s.trim(); });
                var matchTag = '';

                for (var i = 0; i < refTags.length; i++) {
                    for (var j = 0; j < accParts.length; j++) {
                        if (accParts[j] === refTags[i]) { matchTag = refTags[i]; break; }
                    }
                    if (matchTag) break;
                }

                if (matchTag || refTags.length === 0) {
                    var series = currentMatch[1] || '';
                    if (key === '一体线' && series.indexOf('ID2000XM') >= 0 && (r[4] || '') === '101515363') return;
                    var bothStd = camStdTags[matchTag] && accFlag === '1';
                    _tmpItems.push({
                        series: r[2] || '',
                        name: r[3] || '',
                        desc: r[5] || '',
                        code: r[4] || '',
                        remark: r[6] || '',
                        isStd: bothStd
                    });
                }
            }
        });

        var hasOptional = _tmpItems.some(function(x) { return !x.isStd; });
        _tmpItems.forEach(function(x) {
            if (!hasOptional || !x.isStd) {
                currentAccessoryItems.push({
                    series: x.series, name: x.name, desc: x.desc,
                    code: x.code, remark: x.remark
                });
            }
        });

        document.getElementById('modalTitle').textContent = catName + ' - 选择配件';
        tempSelectedItems = selectedAccessories.filter(function(a) {
            return a.key === key;
        }).map(function(a) { return a.code; });

        if (cableCategories[key]) {
            cableFilterState = { length: 'all', material: 'all' };
            renderCableFilterArea();
            renderCableFilteredItems();
        } else {
            document.getElementById('cableFilterArea').innerHTML = '';
            renderCableFilteredItems();
        }

        resizeModalBody();
        document.getElementById('accessoryModal').classList.add('active');
    }

    /* ==================== 关闭弹窗 ==================== */

    function closeModal() {
        document.getElementById('accessoryModal').classList.remove('active');
        currentAccessoryKey = '';
        currentAccessoryItems = [];
        tempSelectedItems = [];
        document.getElementById('cableFilterArea').innerHTML = '';
    }

    /* ==================== 线缆筛选 ==================== */

    function extractCableLengths() {
        var lengths = {};
        currentAccessoryItems.forEach(function(item) {
            var s = item.series || '';
            var m = s.match(/^(\d+(?:\.\d+)?m)/);
            if (m) lengths[m[1]] = true;
        });
        return Object.keys(lengths).sort(function(a, b) {
            return parseFloat(a) - parseFloat(b);
        });
    }

    function extractCableMaterials(key) {
        var mats = {};
        var kw = cableCategories[key].materials;
        currentAccessoryItems.forEach(function(item) {
            var s = item.series || '';
            for (var i = 0; i < kw.length; i++) {
                if (s.indexOf(kw[i]) >= 0) mats[kw[i]] = true;
            }
        });
        return Object.keys(mats);
    }

    function renderCableFilterArea() {
        var fa = document.getElementById('cableFilterArea');
        var lengths = extractCableLengths();
        var materials = extractCableMaterials(currentAccessoryKey);
        var h = '<div class="cable-filter">';
        h += '<div class="cable-warn"><em>⚠️ 7m线缆无法配置下单，须订单备注删除标配线缆，再额外下单！</em></div>';
        h += '<div class="cable-filter-row"><span class="cable-filter-label">长度</span><div class="cable-filter-btns">';
        h += '<button class="cable-filter-btn active" onclick="setCableFilter(\'length\',\'all\',this)">全部</button>';
        lengths.forEach(function(l) {
            h += '<button class="cable-filter-btn" onclick="setCableFilter(\'length\',\'' + l + '\',this)">' + l + '</button>';
        });
        h += '</div></div>';
        if (materials.length > 0) {
            h += '<div class="cable-filter-row"><span class="cable-filter-label">材质</span><div class="cable-filter-btns">';
            h += '<button class="cable-filter-btn active" onclick="setCableFilter(\'material\',\'all\',this)">全部</button>';
            materials.forEach(function(m) {
                h += '<button class="cable-filter-btn" onclick="setCableFilter(\'material\',\'' + m + '\',this)">' + m + '</button>';
            });
            h += '</div></div>';
        }
        h += '</div>';
        fa.innerHTML = h;
    }

    function setCableFilter(type, value, btn) {
        cableFilterState[type] = value;
        var row = btn.parentNode;
        var btns = row.querySelectorAll('.cable-filter-btn');
        btns.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        renderCableFilteredItems();
    }

    function parseCableSeriesInfo(series) {
        var s = series || '';
        var len = 'other';
        var mat = '';
        var m = s.match(/^(\d+(?:\.\d+)?m)/);
        if (m) len = m[1];
        var kw = cableCategories[currentAccessoryKey].materials;
        for (var i = 0; i < kw.length; i++) {
            if (s.indexOf(kw[i]) >= 0) { mat = kw[i]; break; }
        }
        return { length: len, material: mat };
    }

    /* ==================== 渲染弹窗配件列表 ==================== */

    function renderCableFilteredItems() {
        var tb = document.getElementById('modalTableBody');
        var filtered = [];
        var isCable = !!cableCategories[currentAccessoryKey];

        currentAccessoryItems.forEach(function(item) {
            if (isCable) {
                var info = parseCableSeriesInfo(item.series);
                if (cableFilterState.length !== 'all' && info.length !== cableFilterState.length) return;
                if (cableFilterState.material !== 'all' && info.material !== cableFilterState.material) return;
            }
            filtered.push(item);
        });

        if (filtered.length === 0) {
            tb.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:30px;">无匹配的配件</td></tr>';
        } else {
            var h = '';
            filtered.forEach(function(item) {
                var origIdx = currentAccessoryItems.indexOf(item);
                var chk = tempSelectedItems.indexOf(item.code) >= 0 ? 'checked' : '';

                h += '<tr class="' + (chk ? 'acc-selected' : '') + '" style="cursor:pointer" '
                   + 'onclick="var cb=document.getElementById(\'acc_' + origIdx
                   + '\');cb.checked=!cb.checked;toggleTempItem(' + origIdx + ')" '
                   + 'ondblclick="event.preventDefault();event.stopPropagation();'
                   + 'var cb=document.getElementById(\'acc_' + origIdx + '\');'
                   + 'if(!cb.checked){cb.checked=true;toggleTempItem(' + origIdx + ');}confirmAccessories()">'
                   + '<td><input type="checkbox" id="acc_' + origIdx + '" ' + chk
                   + ' onclick="event.stopPropagation();toggleTempItem(' + origIdx + ')"></td>'
                   + '<td class="col-series">' + item.series + '</td>'
                   + '<td class="col-name">' + item.name + '</td>'
                   + '<td class="col-desc">' + item.desc + '</td>'
                   + '<td class="col-code">' + item.code + '</td>'
                   + '</tr>';
            });
            tb.innerHTML = h;
        }
    }

    /* ==================== 配件选择/取消逻辑 ==================== */

    function toggleTempItem(idx) {
        var item = currentAccessoryItems[idx];
        var cb = document.getElementById('acc_' + idx);
        var tr = cb.parentNode.parentNode;
        var key = currentAccessoryKey;

        if (cb.checked) {
            // 非扩展配件：单选互斥
            if (key !== '扩展配件') {
                tempSelectedItems = [];
                currentAccessoryItems.forEach(function(_, i) {
                    var c = document.getElementById('acc_' + i);
                    if (c) {
                        c.checked = false;
                        c.parentNode.parentNode.classList.remove('acc-selected');
                    }
                });
                cb.checked = true;
            }
            tr.classList.add('acc-selected');
            if (tempSelectedItems.indexOf(item.code) < 0) tempSelectedItems.push(item.code);

            // 电源自动配对逻辑
            if (key === '电源') {
                var ms = item.series;
                if (ms === '电源适配器') {
                    var b = currentAccessoryItems.find(function(x) { return x.series === '电源适配器线缆'; });
                    if (b && tempSelectedItems.indexOf(b.code) < 0) {
                        tempSelectedItems.push(b.code);
                        var bi = currentAccessoryItems.indexOf(b);
                        var bc = document.getElementById('acc_' + bi);
                        if (bc) { bc.checked = true; bc.parentNode.parentNode.classList.add('acc-selected'); }
                    }
                } else if (ms === '电源适配器线缆') {
                    var b = currentAccessoryItems.find(function(x) { return x.series === '电源适配器'; });
                    if (b && tempSelectedItems.indexOf(b.code) < 0) {
                        tempSelectedItems.push(b.code);
                        var bi = currentAccessoryItems.indexOf(b);
                        var bc = document.getElementById('acc_' + bi);
                        if (bc) { bc.checked = true; bc.parentNode.parentNode.classList.add('acc-selected'); }
                    }
                } else if (ms.indexOf('开关电源') === 0 && ms.indexOf('线缆') < 0) {
                    var b = currentAccessoryItems.find(function(x) { return x.series.indexOf('开关电源线缆') >= 0; });
                    if (b && tempSelectedItems.indexOf(b.code) < 0) {
                        tempSelectedItems.push(b.code);
                        var bi = currentAccessoryItems.indexOf(b);
                        var bc = document.getElementById('acc_' + bi);
                        if (bc) { bc.checked = true; bc.parentNode.parentNode.classList.add('acc-selected'); }
                    }
                } else if (ms.indexOf('开关电源线缆') >= 0) {
                    var b = currentAccessoryItems.find(function(x) {
                        return x.series.indexOf('开关电源') === 0 && x.series.indexOf('线缆') < 0;
                    });
                    if (b && tempSelectedItems.indexOf(b.code) < 0) {
                        tempSelectedItems.push(b.code);
                        var bi = currentAccessoryItems.indexOf(b);
                        var bc = document.getElementById('acc_' + bi);
                        if (bc) { bc.checked = true; bc.parentNode.parentNode.classList.add('acc-selected'); }
                    }
                }
            }
        } else {
            // 取消选择
            tr.classList.remove('acc-selected');
            tempSelectedItems = tempSelectedItems.filter(function(n) { return n !== item.code; });

            if (key === '电源') {
                var ms = item.series;
                if (ms === '电源适配器' || ms === '电源适配器线缆') {
                    var bs = ms === '电源适配器' ? '电源适配器线缆' : '电源适配器';
                    var b = currentAccessoryItems.find(function(x) { return x.series === bs; });
                    if (b) {
                        tempSelectedItems = tempSelectedItems.filter(function(n) { return n !== b.code; });
                        var bi = currentAccessoryItems.indexOf(b);
                        var bc = document.getElementById('acc_' + bi);
                        if (bc) { bc.checked = false; bc.parentNode.parentNode.classList.remove('acc-selected'); }
                    }
                } else if (ms.indexOf('开关电源') === 0) {
                    var bs = ms.indexOf('开关电源线缆') >= 0 ? '开关电源' : '开关电源线缆';
                    var b = currentAccessoryItems.find(function(x) { return x.series.indexOf(bs) === 0; });
                    if (b) {
                        tempSelectedItems = tempSelectedItems.filter(function(n) { return n !== b.code; });
                        var bi = currentAccessoryItems.indexOf(b);
                        var bc = document.getElementById('acc_' + bi);
                        if (bc) { bc.checked = false; bc.parentNode.parentNode.classList.remove('acc-selected'); }
                    }
                }
            }
        }
    }

    /* ==================== 确认配件选择 ==================== */

    function confirmAccessories() {
        var key = currentAccessoryKey;
        selectedAccessories = selectedAccessories.filter(function(a) {
            return a.key !== key || (key === '扩展配件' && a.type === 'standard');
        });
        tempSelectedItems.forEach(function(code) {
            var item = currentAccessoryItems.find(function(i) { return i.code === code; });
            if (item) {
                selectedAccessories.push({
                    key: key, 
                    subCategory: (key === '扩展配件') ? (item.series || '') : '',  // ← 新增
                    name: item.name, 
                    value: item.desc,
                    code: item.code, 
                    remark: item.remark, 
                    type: 'optional'
                });
            }
        });
        closeModal();
        renderTable();
        renderAccessoryCategories();
    }

    /* ==================== 生成标配配件 ==================== */

    function generateStandardAccessories() {
        if (!currentMatch) { alert('请先选择产品型号'); return; }
        selectedAccessories = [];
        standardCache = {};
        var keys = Object.keys(accessoryColumns);

        for (var i = 0; i < keys.length; i++) {
            var cfg = accessoryColumns[keys[i]];
            var val = currentMatch[cfg.col] || '';
            if (!val) continue;

            var refTags = val.split(';').map(function(s) {
                return s.trim().toLowerCase();
            }).filter(function(s) { return s.length > 0; });

            var refFlags = (currentMatch[cfg.flagCol] || '').split(';').map(function(s) {
                return s.trim();
            });

            var camStdTags = {};
            refTags.forEach(function(t, i) {
                if (refFlags[i] === '1') camStdTags[t] = true;
            });

            if (Object.keys(camStdTags).length === 0) continue;

            for (var j = 0; j < allRows.length; j++) {
                var r = allRows[j];
                var accCol = getAccCol(r, cfg);
                if (r.length > accCol && r[1] && r[1].trim() === cfg.name) {
                    var accFlagCol = getAccFlagCol(r, cfg);
                    var accTag = (r[accCol] || '').toLowerCase();
                    var accFlag = accFlagCol >= 0 ? (r[accFlagCol] || '') : '';

                    for (var k = 0; k < refTags.length; k++) {
                        var accParts = accTag.split(';').map(function(s) { return s.trim(); });
                        var exactMatch = false;
                        for (var p = 0; p < accParts.length; p++) {
                            if (accParts[p] === refTags[k]) { exactMatch = true; break; }
                        }
                        if (exactMatch && camStdTags[refTags[k]] && accFlag === '1') {
                            var item = {
                                key: keys[i], 
                                subCategory: (keys[i] === '扩展配件') ? (r[2] || '') : '',
                                name: r[3] || cfg.name, 
                                value: r[5] || val,
                                code: r[4] || '', 
                                remark: r[6] || '', 
                                type: 'standard'
                            };
                            selectedAccessories.push(item);
                            standardCache[keys[i]] = item;
                            break;
                        }
                    }
                }
            }
        }
        renderTable();
    }

    /* ==================== 渲染配单明细表 ==================== */

    function renderTable() {
    var tblHead = '<thead><tr>'
        + '<th style="width:70px">类型</th>'
        + '<th style="width:260px">物料名称</th>'
        + '<th style="width:380px">描述</th>'
        + '<th style="width:100px">物料代码</th>'
        + '<th style="width:200px">备注</th>'
        + '<th style="width:60px">操作</th>'
        + '</tr></thead>';

    // 无主机但有选配件的场景
    if (!currentMatch && selectedAccessories.length > 0) {
        document.getElementById('statTotal').textContent = selectedAccessories.length;
        document.getElementById('statHost').textContent = 0;
        document.getElementById('statAccessory').textContent = selectedAccessories.length;
        var h = '<table class="data-table">' + tblHead + '<tbody>';
        selectedAccessories.forEach(function(a) {
            // ★★★ 无主机场景：扩展配件使用 subCategory ★★★
            var typeLabel;
            if (a.key === '扩展配件') {
                typeLabel = a.subCategory || '扩展配件';
            } else {
                typeLabel = a.key || '选配';
            }
            h += '<tr>'
               + '<td><span class="type-badge optional">' + typeLabel + '</span></td>'
               + '<td class="material-name">' + a.name + '</td>'
               + '<td class="material-desc">' + a.desc + '</td>'
               + '<td class="material-code">' + (a.code || '-') + '</td>'
               + '<td>' + (a.remark || '') + '</td>'
               + '<td><button class="btn-remove" onclick="removeItem(\'' + a.name.replace(/'/g, "\\'") + '\')">✕</button></td>'
               + '</tr>';
        });
        h += '</tbody></table><div class="table-footer"><span>共 ' + selectedAccessories.length + ' 行</span></div>';
        document.getElementById('tableArea').innerHTML = h;
        return;
    }

    if (!currentMatch) { clearTable(); return; }

    var items = [];

    // 主机行
    items.push({
        type: 'host', typeName: '主机',
        name: currentMatch[3] || '-', desc: currentMatch[5] || '-',
        code: currentMatch[4] || '-', remark: currentMatch[6] || ''
    });

    // 线缆标配判断
    var cableKeys = { '一体线': true, 'IO线': true, '网线': true };
    var cableIsStd = {};
    Object.keys(cableKeys).forEach(function(k) {
        var cfg = accessoryColumns[k];
        if (cfg && cfg.flagCol) {
            cableIsStd[k] = (currentMatch[cfg.flagCol] || '').split(';').map(function(s) {
                return s.trim();
            }).some(function(f) { return f === '1'; });
        }
    });

    // 选配排序：选配在前
    var sorted = selectedAccessories.slice().sort(function(a, b) {
        if (a.type === 'optional' && b.type !== 'optional') return -1;
        if (a.type !== 'optional' && b.type === 'optional') return 1;
        return 0;
    });

    sorted.forEach(function(a) {
        var remark = a.remark || '';
        if (a.type === 'optional' && cableKeys[a.key] && !cableIsStd[a.key]) remark = '';
        
        // ★★★ 确定显示的类型名称 ★★★
        var displayType;
        if (a.key === '扩展配件') {
            // 扩展配件：使用 subCategory（即配件行 row[2] 的值）
            displayType = a.subCategory || '扩展配件';
        } else {
            // 其他配件：使用 key（如"电源"、"安装板"等）
            displayType = a.key;
        }
        
        items.push({
            type: a.type,
            typeName: a.type === 'standard' ? '标配' : '选配',
            displayType: displayType,
            name: a.name,
            desc: a.value,
            code: a.code || '-',
            remark: remark
        });

    document.getElementById('statHost').textContent = 1;

            actionBtn = '<button class="btn-remove" onclick="removeItem(\'' + item.name.replace(/'/g, "\\'") + '\')">✕</button>';
        }

        // ★★★ 核心修改：主机显示"主机"，配件显示 displayType（子类别名称）★★★
        var typeLabel = (item.type === 'host') ? '主机' : (item.displayType || item.typeName);

        h += '<tr>'
           + '<td><span class="type-badge ' + item.type + '">' + typeLabel + '</span></td>'
           + '<td class="material-name">' + item.name + '</td>'
           + '<td class="material-desc">' + item.desc + '</td>'

    /* ==================== 移除选配项 ==================== */

    function removeItem(name) {
        var idx = selectedAccessories.findIndex(function(a) { return a.name === name; });
        if (idx === -1) return;
        var removed = selectedAccessories[idx];
        selectedAccessories.splice(idx, 1);

        // 移除选配后恢复对应标配
        if (removed && removed.type === 'optional' && standardCache[removed.key]) {
            if (removed.key === '扩展配件') {
                var alreadyHasStd = selectedAccessories.some(function(a) {
                    return a.key === removed.key && a.type === 'standard';
                });
                if (!alreadyHasStd) {
                    selectedAccessories.push(JSON.parse(JSON.stringify(standardCache[removed.key])));
                }
            } else {
                selectedAccessories.push(JSON.parse(JSON.stringify(standardCache[removed.key])));
            }
        }
        renderTable();
        renderAccessoryCategories();
    }

    /* ==================== CSV 导出 ==================== */

    function csvEscape(s) {
        if (s == null) s = '';
        s = String(s);
        if (s.indexOf(',') >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0 || s.indexOf('\r') >= 0) {
            return '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
    }

    function exportCSV() {
        if (!currentMatch) { alert('请先生成配单'); return; }

        var csv = '\uFEFF类型,物料名称,描述,物料代码,备注\n';
        csv += '主机,' + csvEscape(currentMatch[3] || '-') + ','
              + csvEscape(currentMatch[5] || '-') + ','
              + csvEscape(currentMatch[4] || '-') + ','
              + csvEscape(currentMatch[6] || '') + '\n';

        selectedAccessories.forEach(function(a) {
            if (a.type === 'optional') {
                csv += '选配,' + csvEscape(a.name) + ','
                     + csvEscape(a.value) + ','
                     + csvEscape(a.code || '-') + ','
                     + csvEscape(a.remark || '') + '\n';
            }
        });

        var b = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        var l = document.createElement('a');
        l.href = URL.createObjectURL(b);

        // 文件名带时间戳
        var now = new Date();
        var ts = now.getFullYear()
            + String(now.getMonth() + 1).padStart(2, '0')
            + String(now.getDate()).padStart(2, '0') + '_'
            + String(now.getHours()).padStart(2, '0')
            + String(now.getMinutes()).padStart(2, '0')
            + String(now.getSeconds()).padStart(2, '0');
        l.download = 'ID产品配单表_' + ts + '.csv';
        l.click();
    }

    /* ==================== 快速搜索 ==================== */

    function onQuickSearch() {
        var q = document.getElementById('quickSearchInput').value.trim().toLowerCase();
        var el = document.getElementById('quickSearchResults');
        if (!q) { el.style.display = 'none'; return; }

        var results = [];
        for (var i = 0; i < allRows.length; i++) {
            var r = allRows[i];
            var isCam = r[0] === '相机';
            var isAcc = r[0] === '配件';
            if (!isCam && !isAcc) continue;

            var series = (r[2] || '').toLowerCase();
            var name = (r[3] || '').toLowerCase();
            var code = (r[4] || '').toLowerCase();
            var desc = (r[5] || '').toLowerCase();
            var remark = (r[6] || '').toLowerCase();

            if (series.indexOf(q) >= 0 || name.indexOf(q) >= 0
                || code.indexOf(q) >= 0 || desc.indexOf(q) >= 0 || remark.indexOf(q) >= 0) {
                results.push({
                    idx: i, type: isCam ? '相机' : '配件',
                    cat: r[1] || '', series: r[2] || '', name: r[3] || '',
                    code: r[4] || '', desc: r[5] || ''
                });
                if (results.length >= 50) break;
            }
        }

        if (!results.length) {
            el.innerHTML = '<div style="padding:12px;font-size:11px;color:#94a3b8;text-align:center">无匹配结果</div>';
            el.style.display = 'block';
            return;
        }

        var h = '';
        results.forEach(function(r) {
            var tagText = r.type + ' · ' + r.cat;
            h += '<div class="quick-search-item" onclick="selectQuickSearch(' + r.idx + ')">'
               +   '<div class="qs-row1">'
               +     '<span class="qs-name">' + r.name + '</span>'
               +     '<span class="qs-tag">' + tagText + '</span>'
               +   '</div>'

               +     '<span class="qs-code">' + r.code + '</span>'
               +     '<span>|</span>'
               +     '<span class="qs-desc">' + r.desc + '</span>'
               +   '</div>'

               + '</div>';
        });
        el.innerHTML = h;
        el.style.display = 'block';
    }

    function selectQuickSearch(idx) {
        var r = allRows[idx];
        if (!r) return;
        document.getElementById('quickSearchInput').value = '';
        document.getElementById('quickSearchResults').style.display = 'none';

        if (r[0] === '相机') {
            var cat = r[1], series = r[2], model = r[3];
            var catSel = document.getElementById('categorySelect');
            for (var i = 0; i < catSel.options.length; i++) {
                if (catSel.options[i].value === cat) { catSel.selectedIndex = i; break; }
            }
            onCategoryChange();

            var serSel = document.getElementById('seriesSelect');

            }
            onSeriesChange();

            var modSel = document.getElementById('modelSelect');
            for (var i = 0; i < modSel.options.length; i++) {
                if (modSel.options[i].value === model) { modSel.selectedIndex = i; break; }
            }
            onModelChange();

        } else if (r[0] === '配件') {
            var name = r[3] || '';
            var exists = selectedAccessories.some(function(a) { return a.name === name; });
            if (!exists) {
                selectedAccessories.push({
                    key: '选配', subCategory: (r[1] === '扩展配件') ? (r[2] || '') : '',
                    name: name, value: r[5] || '',
                    code: r[4] || '', remark: r[6] || '', type: 'optional'

            }
        }
    }

    /* ==================== 系列总览 ==================== */

    // 获取系列分组数据
    function getSeriesMap() {
    var map = {};
    var order = [];
    allRows.forEach(function(row) {
        if (row[0] !== '相机') return;
        var key = row[1];
        if (!map[key]) {
            map[key] = [];
            order.push(key);
        }
        map[key].push(row);
    });
    // 返回 { map: 系列名→行数组, order: 系列名列表（按首次出现顺序） }
    return { map: map, order: order };
    }

    function getAccessoriesForSeries(seriesName) {
    var accMap = {};
    // 1. 获取该系列所有相机
    var cameraRows = allRows.filter(function(r) {
        return r[0] === '相机' && r[1] === seriesName;
    });
    // 2. 收集所有引用标签（相机行的配件列）
    var refTags = [];
    var accKeys = Object.keys(accessoryColumns);
    cameraRows.forEach(function(r) {
        accKeys.forEach(function(k) {
            var val = r[accessoryColumns[k].col] || '';
            if (val) {
                var tags = val.split(';').map(function(s) { return s.trim().toLowerCase(); }).filter(Boolean);
                tags.forEach(function(t) { refTags.push(t); });
            }
        });
    });
    refTags = [...new Set(refTags)];
    // 3. 匹配配件行（配件行的标签在索引7）
    allRows.forEach(function(row) {
        if (row[0] !== '配件') return;
        var accTag = (row[7] || '').toLowerCase();
        var parts = accTag.split(';').map(function(s) { return s.trim(); });
        for (var i = 0; i < refTags.length; i++) {
            if (parts.indexOf(refTags[i]) !== -1) {
                var code = row[4] || '';
                if (!accMap[code]) {
                    accMap[code] = row;
                }
                break;
            }
        }
    });
    // 返回配件行数组（顺序按照遍历 allRows 的顺序，即枚举顺序）
    return Object.values(accMap);
    }

    var html = '';

    function renderOverviewTable(seriesName, el) {

        document.querySelectorAll('.series-item').forEach(function(item) {

        });

        var accessoryRows = getAccessoriesForSeries(seriesName);
        // 配件按枚举顺序（allRows 中的索引）排序
        accessoryRows.sort(function(a, b) {
            return allRows.indexOf(a) - allRows.indexOf(b);

                    btn.classList.remove('show');
                }
            };

            // 防抖优化
            var throttleTimer = null;
            var throttledScroll = function() {
                if (throttleTimer) return;
                throttleTimer = setTimeout(function() {
                    scrollHandler();
                    throttleTimer = null;
                }, 80);
            };

            window.addEventListener('scroll', throttledScroll, { passive: true });
            // 页面加载完成时执行一次，确保初始状态正确
            window.addEventListener('load', function() {
                scrollHandler();
            });

            // 点击按钮：平滑回到顶部
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        })();
    });
    </script>

    <div id="announceOverlay" class="announce-overlay">
        <div class="announce-box">
            <div class="announce-header">
                <div class="announce-title">📢 公告</div>
                <button class="announce-close" onclick="closeAnnounce()">✕</button>
            </div>
            <div class="announce-body">
                <div class="announce-content" id="announceContent"></div>
                <div class="announce-date" id="announceDate"></div>
            </div>
            <div class="announce-footer">
                <button class="announce-btn" onclick="closeAnnounce()">我知道了</button>
            </div>
        </div>
    </div>
</body>
</html>
