    <div class="header">
        <div class="header-left">
            <div class="header-logo"><span>ID</span> · <span class="logo-text" id="logoText" onclick="onLogoClick(event)">读码器配单工具<span class="click-hint" id="clickHint"></span></span></div>
            <button class="btn-contact">联系我们</button>
        </div>
        <div class="header-right">计算结果仅供参考，建议实测验证</div>
    </div>
    <div class="container">
        <div class="sidebar">
            <div class="panel">
                <div class="panel-title"><div class="panel-title-icon">📋</div>配单配置</div>
                <div class="quick-search">
                    <div class="quick-search-wrap">
                        <span class="quick-search-icon">🔍</span>
                        <input type="text" id="quickSearchInput" class="quick-search-input" placeholder="输入型号名称或物料代码..." oninput="onQuickSearch()">
                    </div>
                    <div id="quickSearchResults" class="quick-search-results"></div>
                </div>
                <div class="step-section">
                    <div class="step-label"><span class="step-number">1</span>产品大类</div>
                    <select id="categorySelect" class="step-select" onchange="onCategoryChange()"><option value="">请选择产品大类</option></select>
                </div>
                <div class="step-section">
                    <div class="step-label"><span class="step-number">2</span>产品系列</div>
                    <select id="seriesSelect" class="step-select" onchange="onSeriesChange()" disabled><option value="">请先选择产品大类</option></select>
                </div>
                <div class="step-section">
                    <div class="step-label"><span class="step-number">3</span>具体型号</div>
                    <select id="modelSelect" class="step-select" onchange="onModelChange()" disabled><option value="">请先选择产品系列</option></select>
                </div>
                <div class="accessory-title">选装配件</div>
                <div id="accessoryCategories"></div>
            </div>

        </div>
        <div class="content">
            <div class="content-panel">
                <div class="content-header">
                    <div class="content-title"><div class="content-title-icon">📊</div>配单明细</div>
                    <div class="content-toolbar">
                        <div class="legend">
                            <div class="legend-item"><div class="legend-dot host"></div>主机</div>
                            <div class="legend-item"><div class="legend-dot standard"></div>标配</div>
                            <div class="legend-item"><div class="legend-dot optional"></div>选配</div>
                        </div>
                        <div class="toolbar-right">
                            <div class="stats">
                                <div class="stat-item"><div class="stat-value" id="statTotal">0</div><div class="stat-label">总计</div></div>
                                <div class="stat-item"><div class="stat-value" id="statHost">0</div><div class="stat-label">主机</div></div>
                                <div class="stat-item"><div class="stat-value orange" id="statAccessory">0</div><div class="stat-label">配件</div></div>
                            </div>
                            <button class="btn-reset" onclick="clearAll()">清除</button>
                            <button class="btn-reset" onclick="resetConfig()">重置</button>
                            <button class="btn-export" onclick="exportCSV()">📥 导出CSV</button>
                        </div>
                    </div>
                </div>
                <div id="tableArea"><div class="empty-state"><div class="empty-state-icon">📦</div><h3>请选择产品配置</h3><p>在左侧选择产品后，自动生成配单</p></div></div>
            </div>
        </div>
    </div>
    <div id="accessoryModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">选择配件</span>
                <button class="modal-close" onclick="closeModal()">&#x2715;</button>
            </div>
            <div class="modal-body">
                <div id="cableFilterArea"></div>
                <table class="accessory-table">
                    <thead><tr><th style="width:40px">选择</th><th class="col-series">产品系列</th><th class="col-name">物料名称</th><th class="col-desc">描述</th><th class="col-code">物料代码</th></tr></thead>
                    <tbody id="modalTableBody"></tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-confirm" onclick="confirmAccessories()">确定</button>
            </div>
        </div>
    </div>

        function gc(){

    selectedAccessories=[];
    standardCache={};
    var keys=Object.keys(accessoryColumns);
    for(var i=0;i<keys.length;i++){
        var cfg=accessoryColumns[keys[i]],val=currentMatch[cfg.col]||'';
        if(!val)continue;
        var refTags=val.split(';').map(function(s){return s.trim().toLowerCase();}).filter(function(s){return s.length>0;});
            var refFlags=(currentMatch[cfg.flagCol]||'').split(';').map(function(s){return s.trim();});
            var camStdTags={};refTags.forEach(function(t,i){if(refFlags[i]==='1')camStdTags[t]=true;});
            if(Object.keys(camStdTags).length===0)continue;
            for(var j=0;j<allRows.length;j++){
                var r=allRows[j];
                var accCol=getAccCol(r,cfg);
                var dataLen=isAccessory(r)?9:24;
                if(r.length>accCol&&r[1]&&r[1].trim()===cfg.name){
                    var accFlagCol=getAccFlagCol(r,cfg);
                    var accTag=(r[accCol]||'').toLowerCase();
                    var accFlag=accFlagCol>=0?(r[accFlagCol]||''):'';
                    for(var k=0;k<refTags.length;k++){
                        var accParts=accTag.split(';').map(function(s){return s.trim();});
                        var exactMatch=false;
                        for(var p=0;p<accParts.length;p++){
                            if(accParts[p]===refTags[k]){exactMatch=true;break;}
                        }
                        if(exactMatch&&camStdTags[refTags[k]]&&accFlag==='1'){
                            var item={key:keys[i],name:r[3]||cfg.name,value:r[5]||val,code:r[4]||'',remark:r[6]||'',type:'standard'};
                            selectedAccessories.push(item);
                            standardCache[keys[i]]=item;
                            break;
                        }
                    }
                }
            }
    }

function onQuickSearch(){
    var q=document.getElementById('quickSearchInput').value.trim().toLowerCase();
    var el=document.getElementById('quickSearchResults');
    if(!q){el.style.display='none';return;}
    var results=[];
    for(var i=0;i<allRows.length;i++){
        var r=allRows[i];
        var isCam=r[0]==='相机';
        var isAcc=r[0]==='配件';
        if(!isCam&&!isAcc)continue;
        var series=(r[2]||'').toLowerCase();
        var name=(r[3]||'').toLowerCase();
        var code=(r[4]||'').toLowerCase();
        var desc=(r[5]||'').toLowerCase();
        var remark=(r[6]||'').toLowerCase();
        if(series.indexOf(q)>=0||name.indexOf(q)>=0||code.indexOf(q)>=0||desc.indexOf(q)>=0||remark.indexOf(q)>=0){
            results.push({idx:i,type:isCam?'相机':'配件',cat:r[1]||'',series:r[2]||'',name:r[3]||'',code:r[4]||'',desc:r[5]||''});
            if(results.length>=50)break;
        }
    }
    if(!results.length){el.innerHTML='<div style="padding:12px;font-size:11px;color:#94a3b8;text-align:center">无匹配结果</div>';el.style.display='block';return;}
    var h='';
    results.forEach(function(r){
        var tagText=r.type+' · '+r.cat;
        h+='<div class="quick-search-item" onclick="selectQuickSearch('+r.idx+')">'
            +'<div class="qs-row1">'
            +'<span class="qs-name">'+r.name+'</span>'

            +'</div>'

            +'<span class="qs-code">'+r.code+'</span>'

            +'</div>'
            +'<div class="qs-row3">点击加入配单</div>'
            +'</div>';

    el.innerHTML=h;
    el.style.display='block';
}
function selectQuickSearch(idx){
    var r=allRows[idx];
    if(!r)return;
    document.getElementById('quickSearchInput').value='';
    document.getElementById('quickSearchResults').style.display='none';
    if(r[0]==='相机'){
        var cat=r[1],series=r[2],model=r[3];
        var catSel=document.getElementById('categorySelect');
        for(var i=0;i<catSel.options.length;i++){if(catSel.options[i].value===cat){catSel.selectedIndex=i;break;}}
        onCategoryChange();
        var serSel=document.getElementById('seriesSelect');
        for(var i=0;i<serSel.options.length;i++){if(serSel.options[i].value===series){serSel.selectedIndex=i;break;}}
        onSeriesChange();
        var modSel=document.getElementById('modelSelect');
        for(var i=0;i<modSel.options.length;i++){if(modSel.options[i].value===model){modSel.selectedIndex=i;break;}}
        onModelChange();
    }else if(r[0]==='配件'){
        // Add accessory directly to selected list
        var name=r[3]||'';
        var exists=selectedAccessories.some(function(a){return a.name===name;});
        if(!exists){
            selectedAccessories.push({key:'\u9009\u914d',name:name,value:r[5]||'',code:r[4]||'',remark:r[6]||'',type:'optional'});
            rt();
        }
    }
}
